<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Three-day assessment development timeline</title>
  <desc id="description">Eight hours of work across three days. Day one: three hours of analysis, domain study, planning, and refinement. Day two: two hours of Task 1 development and review plus Task 2 development. Day three: three hours of Task 2 development, deployment, documentation, requirements review, and video recording.</desc>

  <rect width="1600" height="900" fill="#F7F9F6"/>
  <rect x="0" y="0" width="1600" height="12" fill="#102820"/>

  <text x="72" y="76" fill="#168263" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ASSESSMENT DELIVERY</text>
  <text x="72" y="130" fill="#17251F" font-family="Georgia, 'Times New Roman', serif" font-size="52">3 days · 8 focused hours</text>
  <text x="72" y="170" fill="#64716B" font-family="Arial, Helvetica, sans-serif" font-size="21">From problem framing and domain study to a deployed prototype and recorded walkthrough.</text>

